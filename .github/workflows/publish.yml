name: Publish to NuGet

# Push a tag such as v0.1.0 to publish that version.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # GitHub OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test samples
        run: dotnet build EnumClass.slnx -c Release

      - name: Pack (version from tag)
        run: dotnet pack src/Xtofs.EnumClass -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v} -p:ContinuousIntegrationBuild=true

      # Exchanges the OIDC token for a NuGet API key that is valid for 1 hour.
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, not the email address

      - name: Push
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
